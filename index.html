<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Mivino Ice Cream</title>

  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">Очки: 0</div>
  <div id="lives">❤️❤️❤️❤️❤️</div>
  <div id="level">Уровень: 1</div>
</div>

<div id="round">0 / 20</div>

<!-- START -->
<div id="start">
  <div class="panel">
    <h1>Mivino Ice Cream</h1>
    <button id="playBtn">Играть</button>
    <button id="statsBtn">Статистика</button>
  </div>
</div>

<!-- STATS -->
<div id="stats">
  <div class="panel">
    <h2>Статистика</h2>
    <p>Лучший: <span id="best">0</span></p>
    <p>Последний: <span id="last">0</span></p>
    <button id="backBtn">Назад</button>
  </div>
</div>

<!-- NEXT -->
<div id="next">
  <div class="panel">
    <h2>Уровень пройден!</h2>
    <button id="nextBtn">Следующий</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="over">
  <div class="panel">
    <h2>Игра окончена</h2>
    <p id="final"></p>
    <button id="restartBtn">Заново</button>
    <button id="overStatsBtn">Статистика</button>
  </div>
</div>

<script src="game.js"></script>

</body>
</html>
