<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ice Cream V32</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="score">Очки: 0</div>
  <div id="lives">❤️❤️❤️❤️❤️</div>
  <div id="level">Уровень: 1</div>
</div>

<div id="round">0 / 20</div>

<div id="start" class="screen">
  <div class="panel">
    <h1>Ice Cream</h1>
    <button id="playBtn">Играть</button>
    <button id="statsBtn">Статистика</button>
  </div>
</div>

<div id="stats" class="screen">
  <div class="panel">
    <h2>Статистика</h2>
    <button id="backBtn">Назад</button>
  </div>
</div>

<div id="next" class="screen">
  <div class="panel">
    <h2>Уровень пройден</h2>
    <button id="nextBtn">Следующий</button>
  </div>
</div>

<div id="over" class="screen">
  <div class="panel">
    <h2>Игра окончена</h2>
    <button id="restartBtn">Заново</button>
  </div>
</div>

<script src="state.js"></script>
<script src="fx.js"></script>
<script src="loader.js"></script>
<script src="render.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>

</body>
</html>
