<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mivino Ice Cream</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="score"></div>
  <div id="lives"></div>
  <div id="level"></div>
</div>

<div id="roundCounter">0 / 20</div>

<div id="startScreen" style="display:flex;">
  <h1>Mivino Ice Cream</h1>
  <button onclick="startGame()">Играть</button>
</div>

<div id="nextLevelScreen">
  <h2>Уровень пройден!</h2>
  <button onclick="nextLevel()">Следующий уровень</button>
</div>

<div id="gameOver">
  <h1>Игра окончена</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Заново</button>
</div>

<script src="game.js"></script>

</body>
</html>
