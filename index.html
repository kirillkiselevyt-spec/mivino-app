<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mivino Ice Cream V20</title>

  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="score"></div>
  <div id="lives"></div>
  <div id="level"></div>
</div>

<div id="roundCounter">0 / 20</div>

<!-- START -->
<div id="startScreen" class="screen">
  <h1>Mivino Ice Cream</h1>
  <button onclick="startGame()">Играть</button>
  <button onclick="openStats()">Статистика</button>
</div>

<!-- STATS -->
<div id="statsScreen" class="screen">
  <h2>Статистика</h2>
  <p>Лучший результат: <span id="bestScore">0</span></p>
  <button onclick="closeStats()">Назад</button>
</div>

<!-- NEXT -->
<div id="nextLevelScreen" class="screen">
  <h2>Уровень пройден!</h2>
  <button onclick="nextLevel()">Следующий уровень</button>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="screen">
  <h1>Игра окончена</h1>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Заново</button>
</div>

<script src="game.js"></script>

</body>
</html>
